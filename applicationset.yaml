apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: nginx-environments
  namespace: argocd

spec:
  generators:
    - list:
        elements:
          - environment: dev
          - environment: stage
          - environment: prod

  template:
    metadata:
      name: "nginx-{{environment}}"

    spec:
      project: default

      source:
        repoURL: https://github.com/Haridevops122/argocd-demo.git
        targetRevision: main
        path: k8s

      destination:
        server: https://kubernetes.default.svc
        namespace: "{{environment}}"

      syncPolicy:
        automated:
          prune: true
          selfHeal: true