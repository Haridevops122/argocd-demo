apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: microservices
  namespace: argocd

spec:
  generators:
    - git:
        repoURL: https://github.com/Haridevops122/argocd-demo.git
        revision: main
        directories:
          - path: apps/*

  template:
    metadata:
      name: "{{path.basename}}"

    spec:
      project: default

      source:
        repoURL: https://github.com/Haridevops122/argocd-demo.git
        targetRevision: main
        path: "{{path}}"

      destination:
        server: https://kubernetes.default.svc
        namespace: "{{path.basename}}"

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
